[theme]
base = "dark"
# Brand colors (Brand Guide CI 2025)
primaryColor = "#89BF40"            # Green
backgroundColor = "#191D21"         # Dark gradient end
secondaryBackgroundColor = "#30383D" # Dark gradient start (sidebar/cards)
textColor = "#F5F5F5"               # Light gradient start
font = "sans serif"

[client]
# Hide developer toolbar/options for anyone viewing the app
toolbarMode = "minimal"
